name: Test Drive image download

on:
  push:
    branches:
      - zip-imagenes-faltantes-20260820
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install gdown
        run: python -m pip install --quiet gdown
      - name: Test downloading the shared Drive folder
        run: |
          mkdir -p source
          gdown --folder 'https://drive.google.com/drive/folders/1V4HgnTCRnwVGwrGD968eNdtvQDGGY7wt?usp=drive_link' -O source
          echo "Files downloaded: $(find source -type f | wc -l)"
          test "$(find source -type f | wc -l)" -gt 0

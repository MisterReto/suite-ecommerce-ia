name: Validar entrega Drive por cliente

on:
  push:
    branches:
      - codex/drive-client-handoff
      - agent/woocommerce-inventory-foundation
  pull_request:
    branches:
      - agent/woocommerce-inventory-foundation

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: |
          pip install --upgrade 'pip>=26.2' 'setuptools>=83' pip-audit pytest
          pip install -r requirements.txt
      - name: Revisar dependencias vulnerables
        run: pip-audit --progress-spinner off
      - name: Compilar Python
        run: python -m compileall -q .
      - name: Verificar aislamiento y delegación entre servicios
        run: |
          python -m unittest test_store_connection test_stability test_sync_changes test_generation_content test_catalog_capture test_variation_stock -q
          python -m unittest test_split_services test_parent_full -q
          python -m unittest test_bulk_security test_inventory_unified -q
          python -m pytest test_gemini_costs.py test_capture_workflow.py test_loyverse.py -q
      - name: Verificar arranque y adaptadores
        env:
          GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-secret
          GOOGLE_REDIRECT_URI: https://example.com/auth/callback
        run: |
          python - <<'PY'
          import product_web_ai
          import app

          assert product_web_ai.fastapi_app is not None
          assert app.NOMBRE_HOJA_INVENTARIO == "Lista completa"
          assert app.NOMBRE_GOOGLE_SHEET == "inventario_completo"
          assert hasattr(app, "_convertir_inventario_importable")
          assert hasattr(app, "_validar_inventario_preparado")
          assert app.MODELO_IMAGEN == "gemini-3.1-flash-image"
          print("Arranque canónico correcto.")
          PY


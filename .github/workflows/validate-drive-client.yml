name: Validar entrega Drive por cliente

on:
  push:
    branches:
      - codex/drive-client-handoff
      - agent/woocommerce-inventory-foundation
      - agent/fastapi-next-delivery
      - agent/catalog-platform
  pull_request:
    branches:
      - agent/woocommerce-inventory-foundation
      - agent/catalog-platform

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rincon_test
          POSTGRES_PASSWORD: test-only-not-a-secret
          POSTGRES_DB: rincon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rincon_test -d rincon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compilar interfaz Next.js
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build
          npm run typecheck
          SUITE_FRONTEND_MODE=standalone SUITE_API_ORIGIN=https://localhost:24443 npm run build
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          node ../test_frontend_proxy.cjs
      - name: Navegación móvil y respuesta perdida en navegador real
        run: |
          npm install --prefix "$RUNNER_TEMP/rincon-browser-test" --no-audit --no-fund playwright@1.62.1
          NODE_PATH="$RUNNER_TEMP/rincon-browser-test/node_modules" TEST_CHROMIUM_PATH="$(command -v google-chrome)" node test_frontend_mobile.cjs
      - name: Instalar dependencias
        run: |
          pip install --upgrade 'pip>=26.2' 'setuptools>=83' pip-audit pytest pyyaml jsonschema
          pip install -r requirements.txt
      - name: Revisar dependencias vulnerables
        run: pip-audit --progress-spinner off
      - name: Compilar Python
        run: python -m compileall -q -x 'node_modules|\.next|\.venv' .
      - name: Validar Blueprint con el schema oficial de Render
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          import yaml
          from jsonschema import Draft202012Validator

          with urlopen("https://render.com/schema/render.yaml.json", timeout=20) as response:
              schema = json.load(response)
          blueprint = yaml.safe_load(Path("deploy/render-platform.yaml").read_text())
          Draft202012Validator(schema).validate(blueprint)
          assert [item["type"] for item in blueprint["services"] if item["type"] != "keyvalue"] == ["web", "web", "web"]
          assert all(item["plan"] == "free" for item in blueprint["services"] + blueprint["databases"])
          worker = next(item for item in blueprint["services"] if item["name"] == "rincon-catalog-worker")
          assert worker["dockerCommand"] == "python -m catalog_platform.worker_web"
          assert any(item["type"] == "keyvalue" and item["maxmemoryPolicy"] == "noeviction" for item in blueprint["services"])
          assert not any(item["name"] in {"suite-ecommerce-ia", "suite-ecommerce-ia-ai"} for item in blueprint["services"])
          print("Blueprint válido: frontend, API y worker independientes; servicios históricos preservados.")
          PY
      - name: Verificar aislamiento y delegación entre servicios
        run: |
          python -m unittest test_store_connection test_stability test_sync_changes test_generation_content test_catalog_capture test_variation_stock -q
          python -m unittest test_split_services test_parent_full -q
          python -m unittest test_bulk_security test_inventory_unified -q
          python -m pytest test_gemini_costs.py test_capture_workflow.py test_loyverse.py test_loyverse_jobs.py -q
          python -m pytest test_studio_api.py test_creative_pipeline.py test_generation_contract.py test_catalog_platform.py test_frontend_separation.py -q
          node test_loyverse_ui.js
      - name: Cola y solicitudes concurrentes en PostgreSQL real
        env:
          TEST_DATABASE_URL: postgresql://rincon_test:test-only-not-a-secret@localhost:5432/rincon_test
          TEST_REDIS_URL: redis://localhost:6379/0
        run: python -m pytest test_catalog_platform.py test_stabilization.py test_free_render.py -q
      - name: Verificar arranque y adaptadores
        env:
          GOOGLE_CLIENT_ID: test-client.apps.googleusercontent.com
          GOOGLE_CLIENT_SECRET: test-secret
          GOOGLE_REDIRECT_URI: https://example.com/auth/callback
        run: |
          python - <<'PY'
          import service_entrypoint
          import app
          import sys

          assert service_entrypoint.fastapi_app is not None
          assert "gradio" not in sys.modules
          assert app.NOMBRE_HOJA_INVENTARIO == "Lista completa"
          assert app.NOMBRE_GOOGLE_SHEET == "inventario_completo"
          assert hasattr(app, "_convertir_inventario_importable")
          assert hasattr(app, "_validar_inventario_preparado")
          assert app.MODELO_IMAGEN == "gemini-3.1-flash-image"
          assert any(getattr(route, "path", "") == "/api/generate" for route in service_entrypoint.fastapi_app.routes)
          print("Arranque FastAPI/Next.js canónico correcto.")
          PY

  generation-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest test_generation_contract.py -q

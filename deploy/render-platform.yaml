# Existing native inventory services; preserve manually configured Neon connections.
previews:
  generation: 'off'
databases: []
services:
- type: keyvalue
  name: rincon-generation-queue
  plan: free
  region: oregon
  maxmemoryPolicy: noeviction
  persistenceMode: 'off'
  ipAllowList: []
- type: web
  name: rincon-frontend
  runtime: docker
  repo: https://github.com/MisterReto/suite-ecommerce-ia
  branch: feature/woocommerce-and-product-removal-20261009
  dockerfilePath: ./Dockerfile.frontend
  dockerContext: .
  plan: free
  region: oregon
  autoDeployTrigger: "off"
  healthCheckPath: /
  envVars:
  - key: SUITE_API_ORIGIN
    fromService:
      type: web
      name: rincon-catalog-api
      envVarKey: RENDER_EXTERNAL_URL
  - key: SUITE_WORKER_ORIGIN
    fromService:
      type: web
      name: rincon-catalog-worker
      envVarKey: RENDER_EXTERNAL_URL
- type: web
  name: rincon-catalog-api
  runtime: docker
  repo: https://github.com/MisterReto/suite-ecommerce-ia
  branch: feature/woocommerce-and-product-removal-20261009
  dockerfilePath: ./Dockerfile.api
  dockerContext: .
  plan: free
  region: oregon
  autoDeployTrigger: "off"
  healthCheckPath: /service-health
  envVars:
  - key: SUITE_SERVE_FRONTEND
    value: 'false'
  - key: APP_PUBLIC_ORIGIN
    fromService:
      type: web
      name: rincon-frontend
      envVarKey: RENDER_EXTERNAL_URL
  - key: DATABASE_URL
    sync: false
  - key: INITIALIZE_EMPTY_DATABASE
    value: 'false'
  - key: IMAGE_WORKER_ORIGIN
    fromService:
      type: web
      name: rincon-catalog-worker
      envVarKey: RENDER_EXTERNAL_URL
  - key: REDIS_URL
    fromService:
      name: rincon-generation-queue
      type: keyvalue
      property: connectionString
  - key: GENERATION_QUEUE_BACKEND
    value: rq
  - key: STUDIO_IMAGE_JOBS
    value: worker
  - key: APP_REQUIRE_ALLOWLIST
    value: 'true'
  - key: MAX_IMAGES_PER_BATCH
    value: '30'
  - key: MAX_ESTIMATED_BATCH_COST
    sync: false
  - key: CREDENTIAL_ENCRYPTION_KEY
    sync: false
  - key: GOOGLE_CLIENT_ID
    fromService:
      type: web
      name: suite-ecommerce-ia
      envVarKey: GOOGLE_CLIENT_ID
  - key: GOOGLE_CLIENT_SECRET
    fromService:
      type: web
      name: suite-ecommerce-ia
      envVarKey: GOOGLE_CLIENT_SECRET
  - key: GOOGLE_DRIVE_FOLDER_ID
    value: 1WNDrC4rMfeg066uciiS5VVOYuTvqoAPT
  - key: APP_ALLOWED_EMAILS
    sync: false
  - key: APP_ROLE_MAP
    sync: false
  - key: APP_DEFAULT_ROLE
    value: viewer
  - key: GOOGLE_SHEET_ID
    value: 1gnuDwcceWwN4ksNnyq3Hs_MQHTfnZQZjeLnph72aUrE
  - key: GOOGLE_REDIRECT_BASE
    fromService:
      type: web
      name: rincon-frontend
      envVarKey: RENDER_EXTERNAL_URL
- type: web
  name: rincon-catalog-worker
  runtime: docker
  repo: https://github.com/MisterReto/suite-ecommerce-ia
  branch: feature/woocommerce-and-product-removal-20261009
  dockerfilePath: ./Dockerfile.worker
  dockerCommand: python -m catalog_platform.worker_web
  dockerContext: .
  plan: free
  region: oregon
  autoDeployTrigger: "off"
  healthCheckPath: /service-health
  envVars:
  - key: DATABASE_URL
    sync: false
  - key: INITIALIZE_EMPTY_DATABASE
    value: 'false'
  - key: REDIS_URL
    fromService:
      name: rincon-generation-queue
      type: keyvalue
      property: connectionString
  - key: GENERATION_QUEUE_BACKEND
    value: rq
  - key: IMAGE_WORKER_CONCURRENCY
    value: '1'
  - key: STUDIO_IMAGE_JOBS
    value: worker
  - key: CREDENTIAL_ENCRYPTION_KEY
    fromService:
      type: web
      name: rincon-catalog-api
      envVarKey: CREDENTIAL_ENCRYPTION_KEY
  - key: GOOGLE_CLIENT_ID
    fromService:
      type: web
      name: suite-ecommerce-ia
      envVarKey: GOOGLE_CLIENT_ID
  - key: GOOGLE_CLIENT_SECRET
    fromService:
      type: web
      name: suite-ecommerce-ia
      envVarKey: GOOGLE_CLIENT_SECRET
  - key: GOOGLE_DRIVE_FOLDER_ID
    fromService:
      type: web
      name: rincon-catalog-api
      envVarKey: GOOGLE_DRIVE_FOLDER_ID
  - key: APP_ROLE_MAP
    fromService:
      type: web
      name: rincon-catalog-api
      envVarKey: APP_ROLE_MAP
  - key: APP_DEFAULT_ROLE
    value: viewer
  - key: GOOGLE_SHEET_ID
    fromService:
      type: web
      name: rincon-catalog-api
      envVarKey: GOOGLE_SHEET_ID
  - key: GOOGLE_REDIRECT_BASE
    fromService:
      type: web
      name: rincon-frontend
      envVarKey: RENDER_EXTERNAL_URL

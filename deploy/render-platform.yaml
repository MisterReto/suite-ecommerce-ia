# Additive proposal. Does not replace either existing web service.
# Provision only after approving recurring compute/storage costs.
previews:
  generation: "off"
databases:
  - name: rincon-catalog-db
    databaseName: rincon_catalog
    user: rincon_app
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
services:
  - type: keyvalue
    name: rincon-generation-queue
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []
  - type: web
    name: rincon-frontend
    runtime: docker
    repo: https://github.com/MisterReto/suite-ecommerce-ia
    branch: agent/stabilize-architecture-20261006
    dockerfilePath: ./Dockerfile.frontend
    dockerContext: .
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /
    envVars:
      - key: SUITE_API_ORIGIN
        sync: false
  - type: web
    name: rincon-catalog-api
    runtime: docker
    repo: https://github.com/MisterReto/suite-ecommerce-ia
    branch: agent/stabilize-architecture-20261006
    dockerfilePath: ./Dockerfile.api
    dockerContext: .
    plan: free
    region: oregon
    autoDeployTrigger: checksPass
    healthCheckPath: /service-health
    envVars:
      - key: SUITE_SERVE_FRONTEND
        value: "false"
      - key: APP_PUBLIC_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rincon-generation-queue
          type: keyvalue
          property: connectionString
      - key: GENERATION_QUEUE_BACKEND
        value: rq
      - key: STUDIO_IMAGE_JOBS
        value: worker
      - key: APP_REQUIRE_ALLOWLIST
        value: "true"
      - key: MAX_IMAGES_PER_BATCH
        value: "30"
      - key: MAX_ESTIMATED_BATCH_COST
        sync: false
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: APP_ALLOWED_EMAILS
        sync: false
      - key: APP_ROLE_MAP
        sync: false
      - key: APP_DEFAULT_ROLE
        value: viewer
      - key: SUITE_SERVICE_ROLE
        value: main
      - key: SUITE_DRIVE_ONLY
        value: "true"
      - key: SYNC_SERVICE_URL
        sync: false
      - key: SYNC_SERVICE_SHARED_KEY
        sync: false
      - key: WC_WRITE_ENABLED
        value: "false"
      - key: WP_MEDIA_WRITE_ENABLED
        value: "false"
  - type: worker
    name: rincon-catalog-worker
    runtime: docker
    repo: https://github.com/MisterReto/suite-ecommerce-ia
    branch: agent/stabilize-architecture-20261006
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: 1c-2g
    region: oregon
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-catalog-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: rincon-generation-queue
          type: keyvalue
          property: connectionString
      - key: GENERATION_QUEUE_BACKEND
        value: rq
      - key: IMAGE_WORKER_CONCURRENCY
        value: "1"
      - key: STUDIO_IMAGE_JOBS
        value: worker
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: APP_ROLE_MAP
        sync: false
      - key: APP_DEFAULT_ROLE
        value: viewer
      - key: SUITE_SERVICE_ROLE
        value: sync
      - key: SUITE_DRIVE_ONLY
        value: "false"
      - key: STOCK_AUTHORITY
        value: app
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: WORDPRESS_URL
        sync: false
      - key: WP_USERNAME
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
      - key: WC_WRITE_ENABLED
        value: "false"
      - key: WP_MEDIA_WRITE_ENABLED
        value: "false"

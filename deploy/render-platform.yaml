# Additive proposal. Does not replace either existing web service.
# Provision only after approving recurring compute/storage costs.
previews:
  generation: "off"
databases:
  - name: rincon-catalog-db
    databaseName: rincon_catalog
    user: rincon_app
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
    diskSizeGB: 1
    ipAllowList: []
services:
  - type: worker
    name: rincon-catalog-worker
    runtime: docker
    repo: https://github.com/MisterReto/suite-ecommerce-ia
    branch: agent/woocommerce-inventory-foundation
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rincon-catalog-db
          property: connectionString
      - key: CREDENTIAL_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_DRIVE_FOLDER_ID
        sync: false
      - key: APP_ROLE_MAP
        sync: false
      - key: APP_DEFAULT_ROLE
        value: viewer
      - key: SUITE_SERVICE_ROLE
        value: sync
      - key: SUITE_DRIVE_ONLY
        value: "false"
      - key: STOCK_AUTHORITY
        value: app
      - key: WOOCOMMERCE_URL
        sync: false
      - key: WOOCOMMERCE_CONSUMER_KEY
        sync: false
      - key: WOOCOMMERCE_CONSUMER_SECRET
        sync: false
      - key: WORDPRESS_URL
        sync: false
      - key: WP_USERNAME
        sync: false
      - key: WP_APP_PASSWORD
        sync: false
      - key: WC_WRITE_ENABLED
        value: "false"
      - key: WP_MEDIA_WRITE_ENABLED
        value: "false"
